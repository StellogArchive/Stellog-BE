name: Spring Boot CI/CD

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build with Gradle without tests
        run: ./gradlew build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image with latest and sha tags
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_IMAGE_NAME }}:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull latest Docker image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_IMAGE_NAME }}:latest

      - name: Create GCP credentials file safely
        run: echo "${{ secrets.GCP_STORAGE_CREDENTIALS }}" | base64 -d > ./src/main/resources/gcp-credentials.json

      - name: Check credential file
        run: ls -l ./src/main/resources/gcp-credentials.json

      - name: Create application-prod.yml
        run: echo "${{secrets.PROD_YML}}" > ./src/resources/application-prod.yml

      - name: Stop existing Docker container
        run: docker stop ${{ secrets.DOCKERHUB_CONTAINER_NAME }} || true

      - name: Remove existing Docker container
        run: docker rm ${{ secrets.DOCKERHUB_CONTAINER_NAME }} || true

      - name: Run new Docker container
        run: |
          docker run -d --name ${{ secrets.DOCKERHUB_CONTAINER_NAME }} -p 8080:8080 \
          -e SPRING_PROFILES_ACTIVE=prod \
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_IMAGE_NAME }}:latest