name: Spring Boot CI/CD
on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build with Gradle without tests
        run: ./gradlew build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image with latest and sha tags
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_IMAGE_NAME }}:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull latest Docker image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_IMAGE_NAME }}:latest

      - name: Create GCP credentials file
        run: echo '${{ secrets.GCP_STORAGE_CREDENTIALS }}' > /home/ec2-user/gcp-credentials.json

      - name: Stop existing Docker container
        run: docker stop ${{ secrets.DOCKERHUB_CONTAINER_NAME }} || true

      - name: Remove existing Docker container
        run: docker rm ${{ secrets.DOCKERHUB_CONTAINER_NAME }} || true

      - name: Run new Docker container
        run: |
          docker run -d --name ${{ secrets.DOCKERHUB_CONTAINER_NAME }} -p 8080:8080 \
          -v /home/ec2-user/gcp-credentials.json:/app/resources/gcp-credentials.json \
          -e SPRING_PROFILES_ACTIVE=prod \
          -e SPRING_DATASOURCE_URL=${{ secrets.DB_URL_PROD }} \
          -e SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USERNAME_PROD }} \
          -e SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD_PROD }} \
          -e SPRING_CLOUD_GCP_STORAGE_CREDENTIALS_LOCATION=/app/resources/gcp-credentials.json \
          -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
          -e JWT_EXPIRY=${{ secrets.JWT_EXPIRY }} \
          -e OAUTH_GOOGLE_CLIENT_ID=${{ secrets.OAUTH_GOOGLE_CLIENT_ID }} \
          -e OAUTH_GOOGLE_CLIENT_SECRET=${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }} \
          -e OAUTH_GOOGLE_REDIRECT_URI=${{ secrets.OAUTH_GOOGLE_REDIRECT_URI }} \
          -e OAUTH_GOOGLE_TOKEN_URI=${{ secrets.OAUTH_GOOGLE_TOKEN_URI }} \
          -e OAUTH_GOOGLE_USER_INFO_URI=${{ secrets.OAUTH_GOOGLE_USER_INFO_URI }} \
          -e OAUTH_KAKAO_CLIENT_ID=${{ secrets.OAUTH_KAKAO_CLIENT_ID }} \
          -e OAUTH_KAKAO_REDIRECT_URI=${{ secrets.OAUTH_KAKAO_REDIRECT_URI }} \
          -e OAUTH_KAKAO_TOKEN_URI=${{ secrets.OAUTH_KAKAO_TOKEN_URI }} \
          -e OAUTH_KAKAO_USER_INFO_URI=${{ secrets.OAUTH_KAKAO_USER_INFO_URI }} \
          -e SWAGGER_SERVER_PROD_URL=${{ secrets.SWAGGER_SERVER_PROD_URL }} \
          -e SWAGGER_SERVER_LOCAL_URL=${{ secrets.SWAGGER_SERVER_LOCAL_URL }} \
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_IMAGE_NAME }}:latest
